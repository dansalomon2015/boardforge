services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardforge
      POSTGRES_USER: boardforge
      POSTGRES_PASSWORD: boardforge
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardforge -d boardforge"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - boardforge-postgres:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://boardforge:boardforge@postgres:5432/boardforge
      DATABASE_REQUIRED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  boardforge-postgres:
