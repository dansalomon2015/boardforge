services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardforge
      POSTGRES_USER: boardforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardforge -d boardforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - boardforge-postgres:/var/lib/postgresql/data

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: unless-stopped
    environment:
      PORT: 4000
      WEB_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DATABASE_URL: postgresql://boardforge:${POSTGRES_PASSWORD}@postgres:5432/boardforge
      DATABASE_REQUIRED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6-luna}
      LLM_PROVIDER: openai
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    expose:
      - "3000"
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - boardforge-caddy-data:/data
      - boardforge-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy

volumes:
  boardforge-postgres:
  boardforge-caddy-data:
  boardforge-caddy-config:
