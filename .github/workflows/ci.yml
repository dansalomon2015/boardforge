name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject committed API keys
        run: |
          if rg -n 'sk-(proj|svcacct)-' . --hidden --glob '!.git/**' --glob '!.env'; then
            exit 1
          fi
      - run: pnpm check
      - name: Validate local Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        env:
          APP_DOMAIN: app.example.com
          API_DOMAIN: api.example.com
          POSTGRES_PASSWORD: ci-only-placeholder
          OPENAI_API_KEY: ci-only-placeholder
          SERVER_IMAGE: boardforge-server:ci
          WEB_IMAGE: boardforge-web:ci
        run: docker compose --env-file .env.example -f compose.production.yaml config --quiet
